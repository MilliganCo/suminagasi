[package]
name = "suminagasi"
version = "0.1.0"
edition = "2021"

[lib]
name = "suminagasi"
path = "src/lib.rs"

[[bin]]
name = "suminagasi"
path = "src/main.rs"

[dependencies]
winit = "0.30"
wgpu = "0.20"
anyhow = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.27"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
pollster = "0.3"
